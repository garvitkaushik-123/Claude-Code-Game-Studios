name: Android debug APK

# Builds an installable debug APK (arm64) from the Godot project and uploads it
# as a workflow artifact. Run it from the Actions tab ("Run workflow") or it runs
# on pushes that touch game files. Debug-signed only: for testing, not for the Play Store.

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-debug-apk.yml"

env:
  GODOT_VERSION: "4.6-stable"
  GODOT_TEMPLATE_DIR: "4.6.stable"

jobs:
  build-apk:
    name: build-apk (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Diagnostic: Godot rejects the preset headlessly with an empty reason, so
        # try variants side by side and keep whichever exports.
        variant: [pkgname, nosign, gradle]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu-24.04 runner image ships the Android SDK; ANDROID_HOME points at it.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkm="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" "platform-tools" "build-tools;35.0.1" "platforms;android-35"

      - name: Install Godot and Android export templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -sSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          mkdir -p "$tdir"
          unzip -q -j templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/android_source.zip" "templates/version.txt" -d "$tdir"
          godot --version

      - name: Create debug keystore and editor settings
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-4.6.tres"

      - name: Import project
        run: godot --headless --path . --import

      - name: Apply preset variant (${{ matrix.variant }})
        run: |
          case "${{ matrix.variant }}" in
            pkgname)
              sed -i 's/^package\/unique_name=.*/package\/unique_name="org.territoryrush.game"/' export_presets.cfg ;;
            nosign)
              sed -i 's/^package\/signed=.*/package\/signed=false/' export_presets.cfg ;;
            gradle)
              sed -i 's/^gradle_build\/use_gradle_build=.*/gradle_build\/use_gradle_build=true/' export_presets.cfg
              mkdir -p android/build
              unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/android_source.zip" -d android/build
              echo -n "${GODOT_TEMPLATE_DIR}" > android/.build_version ;;
          esac
          grep -E "unique_name|signed|use_gradle_build" export_presets.cfg

      - name: Export debug APK
        run: |
          mkdir -p build
          echo "--- SDK:"; ls "${ANDROID_HOME}" "${ANDROID_HOME}/build-tools" "${ANDROID_HOME}/platforms" || true
          echo "--- templates:"; ls -la "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          godot --headless --verbose --path . --export-debug "Android" build/territory-rush-debug.apk || echo "EXPORT FAILED (${{ matrix.variant }})"
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: territory-rush-debug-apk-${{ matrix.variant }}
          path: build/territory-rush-debug.apk
          if-no-files-found: warn
